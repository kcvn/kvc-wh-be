flyway.url=jdbc:postgresql://localhost:5433/kcvn_spm
flyway.user=postgres
flyway.password=password

spring.datasource.url=${flyway.url}
spring.datasource.username=${flyway.user}
spring.datasource.password=${flyway.password}

spring.jooq.sql-dialect=Postgres
# Uncomment below line to show jooq query
#logging.level.org.jooq.tools.LoggerListener=DEBUG

spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# App Properties
kcvn.spm.jwtSecret=====================23=KCVN=SPM=BE=SECRET====================
kcvn.spm.jwtExpirationMs=86400000

# Skip Flyway migration when start application
spring.flyway.enabled=false

# change server port
#server.port=8081

################### JavaMail Configuration ##########################
support.email=support@kcvn.com
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=your_email
spring.mail.password=your_password
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=true
spring.mail.properties.mail.smtps.timeout=8000