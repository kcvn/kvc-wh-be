variables:
  SRC_PATH: .
  DOCKERFILE_PATH: .devops/1-build
  VALUESFILE_PATH: .devops/2-deploy
  
  TEST_DISABLED: "true"
  CODE_QUALITY_DISABLED: "true"
  LICENSE_MANAGEMENT_DISABLED: "true"
  PERFORMANCE_DISABLED: "true"
  LOAD_PERFORMANCE_DISABLED: "true"
  SAST_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  DAST_DISABLED: "true"
  POSTGRES_ENABLED: "false"
 
  KCVN_NAMESPACE: 23-kcvn-spm-dev
  KUBE_INGRESS_BASE_DOMAIN: dev.3si.vn

  KCVN_NAMESPACE_STG: 23-kcvn-spm-stg
  KUBE_INGRESS_BASE_DOMAIN_STG: stg.3si.vn
  
  API_DOMAIN: 23-kcvn-spm.api

#before_script:
#  - export VERSION=$CI_COMMIT_SHORT_SHA
sonarqube-check:
  image: maven:3.6.3-jdk-11
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - mvn verify sonar:sonar -Dsonar.projectKey=23-kcvn-spm-be
  allow_failure: true
  only:
    - develop # or the name of your main branch

stages:
  - build
  - deploy

include:
    - local: .devops/0-cicd/kcvn-api.yml